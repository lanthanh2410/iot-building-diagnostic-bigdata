# ==============================================================================
# Docker Compose: Apache Spark Cluster cho Đồ án Big Data IoT Building Diagnostics
# Thành viên 4: Kiến trúc Hạ tầng Phân tán & Spark Feature Pipeline
# ==============================================================================
# Hướng dẫn khởi chạy:
#   1. Khởi động cụm Spark Cluster:
#      docker compose -f docker-compose.spark.yml up -d
#   2. Kiểm tra trạng thái:
#      docker compose -f docker-compose.spark.yml ps
#   3. Truy cập Spark Master Web UI:
#      http://localhost:8080
#   4. Chạy spark-submit hoặc script PySpark kết nối tới cluster:
#      python src/04_spark_pipeline.py --spark-master spark://localhost:7077
#   5. Dừng cụm:
#      docker compose -f docker-compose.spark.yml down
# ==============================================================================

version: "3.8"

services:
  spark-master:
    image: bitnami/spark:3.5.1
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master RPC Port
      - "4040:4040"   # Spark Application Web UI
    volumes:
      - .:/opt/bitnami/spark/work-dir
      - ./data:/opt/bitnami/spark/work-dir/data
      - ./models:/opt/bitnami/spark/work-dir/models
      - ./docs:/opt/bitnami/spark/work-dir/docs
    working_dir: /opt/bitnami/spark/work-dir
    networks:
      - spark-network

  spark-worker-1:
    image: bitnami/spark:3.5.1
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=3G
      - SPARK_WORKER_CORES=3
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8081:8081"   # Spark Worker 1 Web UI
    volumes:
      - .:/opt/bitnami/spark/work-dir
      - ./data:/opt/bitnami/spark/work-dir/data
      - ./models:/opt/bitnami/spark/work-dir/models
      - ./docs:/opt/bitnami/spark/work-dir/docs
    working_dir: /opt/bitnami/spark/work-dir
    networks:
      - spark-network

  spark-worker-2:
    image: bitnami/spark:3.5.1
    container_name: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=3G
      - SPARK_WORKER_CORES=3
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8082:8082"   # Spark Worker 2 Web UI
    volumes:
      - .:/opt/bitnami/spark/work-dir
      - ./data:/opt/bitnami/spark/work-dir/data
      - ./models:/opt/bitnami/spark/work-dir/models
      - ./docs:/opt/bitnami/spark/work-dir/docs
    working_dir: /opt/bitnami/spark/work-dir
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge
